<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validador | Auditorio Plata</title>
<style>body{background:#0a1927;color:#fff;font:16px Segoe UI,Arial;margin:0;padding:40px 18px}.panel{max-width:760px;margin:auto;padding:30px;border-radius:15px;background:#173142;border:1px solid #a98c56}h1{color:#ecd28d}textarea{width:100%;box-sizing:border-box;height:110px;border-radius:8px;background:#071925;color:#f8f8f8;padding:10px;border:1px solid #8b9fa6}button{margin-top:15px;background:#ecd28d;color:#081824;border:0;border-radius:7px;padding:12px 20px;font-weight:700;cursor:pointer}a{color:#f4cf7f}#resultado{padding:14px;font-weight:700}</style></head><body>
<div class="panel"><a href="/">← Auditorio Plata</a><h1>Validador de boletos</h1><p>Escanea el QR con cualquier lector de celular y pega el texto completo aquí, incluido el campo Firma.</p><textarea id="qr" placeholder="AUDITORIO PLATA|Evento:...|Folio:...|Fecha:...|Hora:...|Firma:..."></textarea><button id="boton">Comprobar autenticidad</button><div id="resultado" role="status"></div><p>La validación compara la firma HMAC y el registro del boleto en Oracle.</p></div>
<script>document.querySelector('#boton').onclick=async()=>{let t=document.querySelector('#qr').value;let o=document.querySelector('#resultado');try{let r=await fetch('/api/validar?qr='+encodeURIComponent(t));let d=await r.json();o.textContent=d.valido?'BOLETO VÁLIDO · Folio '+d.folio:'BOLETO NO VÁLIDO · '+d.razon;o.style.color=d.valido?'#94e4b2':'#ffb5b5';}catch(e){o.textContent='Error de conexión';}}</script></body></html>
